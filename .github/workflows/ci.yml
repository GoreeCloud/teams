name: Verify Teams
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-web:
    name: server-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  native-source:
    name: native-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - working-directory: apps/native
        run: flutter pub get
      - working-directory: apps/native
        run: flutter analyze
      - working-directory: apps/native
        run: flutter test
  native-linux:
    name: native-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - working-directory: apps/native
        run: flutter pub get && flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-teams-linux-x64-debug
          path: apps/native/build/linux/x64/debug/bundle/
          if-no-files-found: error
          retention-days: 7
  native-android:
    name: native-android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - working-directory: apps/native
        run: flutter pub get && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-teams-android-debug
          path: apps/native/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
