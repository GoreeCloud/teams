name: Verify Teams
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-web:
    name: server-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified tag commit
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  native-source:
    name: native-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag commit
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, verified tag commit
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - working-directory: apps/native
        run: flutter pub get
      - working-directory: apps/native
        run: flutter analyze
      - working-directory: apps/native
        run: flutter test
  native-linux:
    name: native-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag commit
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, verified tag commit
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - working-directory: apps/native
        run: flutter pub get && flutter build linux --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified tag commit
        with:
          name: goreecloud-teams-linux-x64-debug
          path: apps/native/build/linux/x64/debug/bundle/
          if-no-files-found: error
          retention-days: 7
  native-android:
    name: native-android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified tag commit
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, verified tag commit
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, verified tag commit
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
      - working-directory: apps/native
        run: flutter pub get && flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified tag commit
        with:
          name: goreecloud-teams-android-debug
          path: apps/native/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  web-browser-acceptance:
    name: web-browser-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified official setup-node v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked Teams dependencies including SQLite native addon
        run: npm ci --no-audit --no-fund
      - name: Build the real React Teams web bundle
        run: npm run build
      - name: Install independent Playwright Core and matching Chromium in ephemeral runner
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Resolve exact installed browser paths
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          import { existsSync,realpathSync,appendFileSync } from 'node:fs';
          const locations = {
            GC_TEAMS_PLAYWRIGHT_CORE: realpathSync('./node_modules/playwright-core/index.mjs'),
            GC_TEAMS_CHROME_BIN: chromium.executablePath()
          };
          for (const [name,path] of Object.entries(locations)) {
            if(!path.startsWith('/')||!existsSync(path))throw Error('Browser runtime missing: '+name);
            appendFileSync(process.env.GITHUB_ENV,name+'='+path+'\n');
          }
          NODE
      - name: Verify synthetic Teams login, native focus, OS theme switching and reflow
        run: |
          mkdir -p apps/web/qa/screenshots
          GC_TEAMS_QA_SCREENSHOTS_DIR="$GITHUB_WORKSPACE/apps/web/qa/screenshots" node apps/web/qa/browser-acceptance.mjs
      - name: Verify real authenticated chat flow against temporary local SQLite server
        run: node apps/web/qa/live-workflow-acceptance.mjs
      - name: Preserve only synthetic login screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified official v4
        with:
          name: teams-web-synthetic-browser-evidence
          path: apps/web/qa/screenshots/teams-*.png
          if-no-files-found: warn
          retention-days: 7
